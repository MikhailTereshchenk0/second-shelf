server:
  port: ${BOOK_SERVICE_PORT}

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT}/${BOOKS_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

jwt:
  secret: ${JWT_SECRET}

internal:
  token: ${INTERNAL_TOKEN}
