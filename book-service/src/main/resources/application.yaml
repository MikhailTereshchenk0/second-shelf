server:
  port: ${BOOK_SERVICE_PORT:8082}

spring:
  application:
    name: book-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${BOOK_DB_NAME:books_db}
    username: ${DB_USERNAME:second_shelf}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

internal:
  token: ${INTERNAL_TOKEN:internal-secret-123}

jwt:
  secret: ${JWT_SECRET:change_this_secret_to_something_long_and_random_1234567890_change_me}