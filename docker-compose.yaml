services:
  postgres:
    image: postgres:16-alpine
    container_name: second-shelf-postgres
    environment:
      POSTGRES_USER: second_shelf
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U second_shelf -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
