services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    ports:
      - "${USER_SERVICE_PORT}:8081"
    environment:
      USER_SERVICE_PORT: 8081
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      USER_DB_NAME: ${USER_DB_NAME}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "${AUTH_SERVICE_PORT}:8080"
    environment:
      AUTH_SERVICE_PORT: 8080
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS}
      USER_SERVICE_BASE_URL: http://user-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy

  book-service:
    build:
      context: .
      dockerfile: book-service/Dockerfile
    ports:
      - "${BOOK_SERVICE_PORT}:8082"
    environment:
      BOOK_SERVICE_PORT: 8082
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      BOOK_DB_NAME: ${BOOK_DB_NAME}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  exchange-service:
    build:
      context: .
      dockerfile: exchange-service/Dockerfile
    ports:
      - "${EXCHANGE_SERVICE_PORT}:8083"
    environment:
      EXCHANGE_SERVICE_PORT: 8083
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      EXCHANGE_DB_NAME: ${EXCHANGE_DB_NAME}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      BOOK_SERVICE_BASE_URL: http://book-service:8082
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EXCHANGE_EVENTS_EXCHANGE: ${EXCHANGE_EVENTS_EXCHANGE:-exchange.events}
      EXCHANGE_EVENTS_QUEUE: ${EXCHANGE_EVENTS_QUEUE:-notification.exchange-events}
      EXCHANGE_EVENTS_ROUTING_KEY_PATTERN: ${EXCHANGE_EVENTS_ROUTING_KEY_PATTERN:-exchange.request.*}
    depends_on:
      postgres:
        condition: service_healthy
      book-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    environment:
      NOTIFICATION_SERVICE_PORT: 8084
      DB_HOST: postgres
      POSTGRES_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      EXCHANGE_EVENTS_EXCHANGE: ${EXCHANGE_EVENTS_EXCHANGE:-exchange.events}
      EXCHANGE_EVENTS_QUEUE: ${EXCHANGE_EVENTS_QUEUE:-notification.exchange-events}
      EXCHANGE_EVENTS_ROUTING_KEY_PATTERN: ${EXCHANGE_EVENTS_ROUTING_KEY_PATTERN:-exchange.request.*}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
