server:
  port: ${USER_SERVICE_PORT}

internal:
  token: ${INTERNAL_TOKEN}

seed:
  admin:
    username: ${SEED_ADMIN_USERNAME}
    password: ${SEED_ADMIN_PASSWORD}
    email: ${SEED_ADMIN_EMAIL}

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT}/${USERS_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update   # TODO: change later
    show-sql: true
    open-in-view: false
