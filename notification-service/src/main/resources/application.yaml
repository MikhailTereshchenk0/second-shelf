server:
  port: ${NOTIFICATION_SERVICE_PORT:8084}

spring:
  application:
    name: notification-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${NOTIFICATION_DB_NAME:notification_db}
    username: ${DB_USERNAME:second_shelf}
    password: ${DB_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

notification:
  rabbitmq:
    exchange: ${EXCHANGE_EVENTS_EXCHANGE:${NOTIFICATION_RABBIT_EXCHANGE:exchange.events}}
    queue: ${EXCHANGE_EVENTS_QUEUE:${NOTIFICATION_RABBIT_QUEUE:notification.exchange-events}}
    routing-key-pattern: ${EXCHANGE_EVENTS_ROUTING_KEY_PATTERN:${NOTIFICATION_RABBIT_ROUTING_KEY_PATTERN:exchange.request.*}}
    dead-letter-exchange: ${EXCHANGE_EVENTS_DLQ_EXCHANGE:${NOTIFICATION_RABBIT_DLQ_EXCHANGE:}}
    dead-letter-queue: ${EXCHANGE_EVENTS_DLQ_QUEUE:${NOTIFICATION_RABBIT_DLQ_QUEUE:}}
    dead-letter-routing-key: ${EXCHANGE_EVENTS_DLQ_ROUTING_KEY:${NOTIFICATION_RABBIT_DLQ_ROUTING_KEY:}}

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rabbit,rabbitListeners
        asyncFlow:
          include: readinessState,db,rabbit,rabbitListeners
          show-details: always
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: notification-service
    description: Notification center service for Second Shelf
    version: v1

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
