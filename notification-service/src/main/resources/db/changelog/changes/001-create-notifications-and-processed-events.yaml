databaseChangeLog:
  - changeSet:
      id: 001-create-notifications-and-processed-events
      author: MikhailTereshchenk0
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notifications
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: message
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: related_entity_type
                  type: VARCHAR(100)

              - column:
                  name: related_entity_id
                  type: VARCHAR(100)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: read_at
                  type: TIMESTAMP

        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_created
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at

        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status

        - createTable:
            tableName: processed_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_processed_events
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)

              - column:
                  name: processed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
