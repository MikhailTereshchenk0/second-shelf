databaseChangeLog:
  - changeSet:
      id: 002-create-outbox-events
      author: MikhailTereshchenk0
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false

              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: attempts_count
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: outbox_events
            columnNames: event_id
            constraintName: uk_outbox_events_event_id

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_status_created
            columns:
              - column:
                  name: status
              - column:
                  name: created_at

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id
