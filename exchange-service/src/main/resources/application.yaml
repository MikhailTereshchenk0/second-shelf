server:
  port: ${EXCHANGE_SERVICE_PORT:8083}

spring:
  application:
    name: exchange-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${EXCHANGE_DB_NAME:exchange_db}
    username: ${DB_USERNAME:second_shelf}
    password: ${DB_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

internal:
  token: ${INTERNAL_TOKEN:}

book-service:
  base-url: ${BOOK_SERVICE_BASE_URL:http://localhost:8082}

exchange:
  outbox:
    rabbitmq:
      exchange: ${EXCHANGE_EVENTS_EXCHANGE:${EXCHANGE_OUTBOX_RABBIT_EXCHANGE:exchange.events}}
      queue: ${EXCHANGE_EVENTS_QUEUE:${EXCHANGE_OUTBOX_RABBIT_QUEUE:notification.exchange-events}}
      routing-key-pattern: ${EXCHANGE_EVENTS_ROUTING_KEY_PATTERN:${EXCHANGE_OUTBOX_RABBIT_ROUTING_KEY_PATTERN:exchange.request.*}}
      dead-letter-exchange: ${EXCHANGE_EVENTS_DLQ_EXCHANGE:${EXCHANGE_OUTBOX_RABBIT_DLQ_EXCHANGE:}}
      dead-letter-queue: ${EXCHANGE_EVENTS_DLQ_QUEUE:${EXCHANGE_OUTBOX_RABBIT_DLQ_QUEUE:}}
      dead-letter-routing-key: ${EXCHANGE_EVENTS_DLQ_ROUTING_KEY:${EXCHANGE_OUTBOX_RABBIT_DLQ_ROUTING_KEY:}}
    publisher:
      enabled: ${EXCHANGE_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${EXCHANGE_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
      confirm-timeout-ms: ${EXCHANGE_OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:10000}
      max-attempts: ${EXCHANGE_OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}

jwt:
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
        asyncFlow:
          include: readinessState,db,rabbit,exchangeOutbox
          show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    rabbit:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
