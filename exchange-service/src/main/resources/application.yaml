server:
  port: ${EXCHANGE_SERVICE_PORT}

spring:
  application:
    name: exchange-service

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT}/${EXCHANGE_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

jwt:
  secret: ${JWT_SECRET}

internal:
  token: ${INTERNAL_TOKEN}

book-service:
  base-url: ${BOOK_SERVICE_BASE_URL}
