server:
  port: ${EXCHANGE_SERVICE_PORT:8083}

spring:
  application:
    name: exchange-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${EXCHANGE_DB_NAME:exchange_db}
    username: ${DB_USERNAME:second_shelf}
    password: ${DB_PASSWORD:secret}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

internal:
  token: ${INTERNAL_TOKEN:internal-secret-123}

book-service:
  base-url: ${BOOK_SERVICE_BASE_URL:http://localhost:8082}

exchange:
  outbox:
    rabbitmq:
      exchange: ${EXCHANGE_OUTBOX_RABBIT_EXCHANGE:exchange.events}
    publisher:
      enabled: ${EXCHANGE_OUTBOX_PUBLISHER_ENABLED:true}
      fixed-delay-ms: ${EXCHANGE_OUTBOX_PUBLISHER_FIXED_DELAY_MS:5000}
      confirm-timeout-ms: ${EXCHANGE_OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:10000}

jwt:
  secret: ${JWT_SECRET:change_this_secret_to_something_long_and_random_1234567890_change_me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"
