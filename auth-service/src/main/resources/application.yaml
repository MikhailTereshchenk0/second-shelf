server:
  port: ${AUTH_SERVICE_PORT:8080}

spring:
  application:
    name: auth-service
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${AUTH_DB_NAME:auth_db}
    username: ${DB_USERNAME:second_shelf}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

internal:
  token: ${INTERNAL_TOKEN:}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}

auth:
  refresh-token:
    pepper: ${AUTH_REFRESH_TOKEN_PEPPER:}

app:
  security:
    public-docs-enabled: false

jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${app.security.public-docs-enabled:false}
  swagger-ui:
    enabled: ${app.security.public-docs-enabled:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
